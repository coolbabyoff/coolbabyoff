<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coolbabyoff | Portfolio</title>
    <meta name="theme-color" content="#07152f">
    <meta name="description" content="Portfolio de coolbabyoff">
    <link rel="icon" href="favicon.ico?v=2">

    <style>
        :root {
            --cyan: #27f5eb;
            --blue: #2735f5;
            --deep-blue: #0d1470;
            --glass: rgba(8, 20, 48, 0.65);
            --border: rgba(39, 245, 235, 0.25);
            --text: #f3fbff;
            --muted: #a8c5dc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
            overflow-x: hidden;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 50% 15%, rgba(39, 53, 245, 0.20), transparent 60%),
                #030817 url("wallpaper.webp") center / cover fixed no-repeat;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(2, 7, 22, 0.48);
            pointer-events: none;
            z-index: -1;
        }

        button,
        a {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            color: inherit;
        }

        .page {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 1;
            animation: pageAppear 0.8s ease both;
        }

        .profile-card {
            width: 100%;
            padding: 28px 22px 20px;
            border: 1px solid var(--border);
            border-radius: 26px;
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.4),
                0 0 35px rgba(39, 245, 235, 0.06);
            text-align: center;
        }

        .avatar-wrapper {
            width: 112px;
            height: 112px;
            margin: 0 auto 18px;
            padding: 4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            box-shadow: 0 0 28px rgba(39, 245, 235, 0.20);
        }

        .avatar {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #081329;
        }

        .name-plaque {
            --magnet-x: 0px;
            --magnet-y: 0px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            margin: 0 auto 12px;
            padding: 12px 23px;
            border: 1px solid rgba(39, 245, 235, 0.32);
            border-radius: 15px;
            background: rgba(7, 18, 43, 0.76);
            box-shadow:
                inset 0 0 18px rgba(39, 245, 235, 0.04),
                0 0 22px rgba(39, 53, 245, 0.10);
            transform: translate(var(--magnet-x), var(--magnet-y));
            transition:
                transform 0.12s ease-out,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
            will-change: transform;
        }

        .name-plaque:hover {
            border-color: rgba(39, 245, 235, 0.65);
            box-shadow:
                0 0 24px rgba(39, 245, 235, 0.12),
                inset 0 0 18px rgba(39, 245, 235, 0.05);
        }

        .name-plaque h1 {
            font-size: clamp(23px, 6vw, 30px);
            font-weight: 800;
            letter-spacing: 0.5px;
            overflow-wrap: anywhere;
            background: linear-gradient(90deg, #ffffff, var(--cyan), #b6c8ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .bio {
            margin: 0 auto 24px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .link-button {
            position: relative;
            isolation: isolate;
            min-height: 54px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 18px;
            overflow: hidden;
            border: 1px solid rgba(39, 245, 235, 0.24);
            border-radius: 15px;
            background: rgba(9, 26, 61, 0.74);
            color: #f5fcff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.2px;
            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .link-button::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(100deg, rgba(39, 245, 235, 0.10), rgba(39, 53, 245, 0.18));
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .link-button:hover {
            transform: translateY(-2px);
            border-color: rgba(39, 245, 235, 0.65);
            box-shadow: 0 7px 22px rgba(0, 0, 0, 0.20);
        }

        .link-button:hover::before {
            opacity: 1;
        }

        .link-button:active {
            transform: translateY(0) scale(0.99);
        }

        .link-button img {
            width: 25px;
            height: 25px;
            flex: 0 0 25px;
            object-fit: contain;
        }

        .link-button span {
            overflow-wrap: anywhere;
        }

        .link-button.contact-button {
            border: 1px solid rgba(255, 126, 45, 0.75);
            background: linear-gradient(110deg, #ffad32 0%, #ff6b25 45%, #ed303b 100%);
            color: #ffffff;
            box-shadow:
                0 5px 18px rgba(255, 91, 35, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .link-button.contact-button::before {
            background: linear-gradient(110deg, #ffc45c 0%, #ff572d 48%, #d91d42 100%);
            opacity: 0;
        }

        .link-button.contact-button:hover {
            border-color: rgba(255, 196, 92, 0.95);
            box-shadow:
                0 8px 26px rgba(255, 76, 39, 0.32),
                0 0 20px rgba(255, 106, 37, 0.15);
        }

        .link-button.contact-button:hover::before {
            opacity: 1;
        }

        .music-player {
            margin-top: 22px;
            padding: 15px;
            border: 1px solid rgba(39, 245, 235, 0.16);
            border-radius: 16px;
            background: rgba(3, 12, 32, 0.48);
        }

        .music-title {
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .audio-toggle {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(39, 245, 235, 0.3);
            border-radius: 12px;
            background: rgba(39, 53, 245, 0.16);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .audio-toggle:hover {
            background: rgba(39, 245, 235, 0.14);
        }

        .volume-control {
            width: 100%;
            max-width: 190px;
            accent-color: var(--cyan);
            cursor: pointer;
        }

        .volume-label {
            min-width: 35px;
            color: var(--muted);
            font-size: 12px;
            text-align: right;
        }

        footer {
            padding-top: 20px;
            color: rgba(210, 232, 248, 0.64);
            font-size: 12px;
            text-align: center;
        }

        footer .heart {
            color: #ff6388;
        }

        .enter-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at center, rgba(13, 20, 112, 0.65), rgba(2, 6, 20, 0.97)),
                url("wallpaper.webp") center / cover no-repeat;
            cursor: pointer;
            transition: opacity 0.65s ease, visibility 0.65s ease;
        }

        .enter-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-content {
            text-align: center;
            animation: enterPulse 2s ease-in-out infinite;
        }

        .enter-content h2 {
            margin-bottom: 12px;
            font-size: clamp(22px, 5vw, 34px);
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 24px rgba(39, 245, 235, 0.45);
        }

        .enter-content p {
            color: var(--cyan);
            font-size: 12px;
            letter-spacing: 2px;
        }

        .toast {
            position: fixed;
            z-index: 2000;
            left: 50%;
            bottom: 25px;
            max-width: calc(100% - 32px);
            padding: 12px 18px;
            border: 1px solid rgba(39, 245, 235, 0.36);
            border-radius: 12px;
            background: rgba(5, 17, 42, 0.94);
            color: #f5fcff;
            font-size: 13px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, 12px);
            transition:
                opacity 0.25s ease,
                transform 0.25s ease,
                visibility 0.25s ease;
        }

        .toast.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        @keyframes pageAppear {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes enterPulse {
            0%, 100% {
                opacity: 0.75;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.035);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
                background-attachment: scroll;
            }

            .profile-card {
                padding: 24px 16px 18px;
                border-radius: 22px;
            }

            .avatar-wrapper {
                width: 100px;
                height: 100px;
            }

            .link-button {
                min-height: 52px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="enter-screen" id="enterScreen" role="button" tabindex="0" aria-label="Entrer sur le portfolio">
        <div class="enter-content">
            <h2>CLICK TO ENTER</h2>
            <p>COOLBABYOFF · PORTFOLIO</p>
        </div>
    </div>

    <main class="page">
        <section class="profile-card">
            <div class="avatar-wrapper">
                <img class="avatar" src="profile.png" alt="Avatar de coolbabyoff">
            </div>

            <div class="name-plaque" id="namePlaque">
                <h1>coolbabyoff</h1>
            </div>

            <p class="bio">
                Salut et bienvenue sur mon portfolio ! (Salut Zoey)
            </p>

            <nav class="links" aria-label="Mes liens">
                <a href="#" class="link-button copy-link" data-copy="coolbabyoff" data-message="Pseudo Discord copié !">
                    <img src="discord.png" alt="">
                    <span>Discord</span>
                </a>

                <a href="https://bit.ly/4ev9TRN" class="link-button" target="_blank" rel="noopener noreferrer">
                    <img src="paypal.png" alt="">
                    <span>PayPal</span>
                </a>

                <a href="https://steamcommunity.com/id/CBOfficial/" class="link-button" target="_blank" rel="noopener noreferrer">
                    <img src="steam.png" alt="">
                    <span>Steam</span>
                </a>

                <a href="https://roblox.com/users/2521964602/profile" class="link-button" target="_blank" rel="noopener noreferrer">
                    <img src="roblox.png" alt="">
                    <span>Roblox</span>
                </a>

                <a href="#" class="link-button copy-link" data-copy="coolbabyofficiaL" data-message="Pseudo PlayStation Network copié !">
                    <img src="playstation.png" alt="">
                    <span>PlayStation Network</span>
                </a>

                <a href="https://www.curseforge.com/members/AgamesStudio/projects" class="link-button contact-button" target="_blank" rel="noopener noreferrer">
                    <img src="agamesstudio.png" alt="">
                    <span>Contact</span>
                </a>
            </nav>

            <section class="music-player" aria-label="Lecteur musical">
                <p class="music-title">Background music</p>

                <div class="audio-controls">
                    <button type="button" class="audio-toggle" id="audioToggle" aria-label="Activer ou couper la musique" title="Activer ou couper la musique">
                        <span id="audioIcon">♫</span>
                    </button>

                    <input class="volume-control" id="volumeControl" type="range" min="0" max="100" value="35" aria-label="Volume de la musique">
                    <span class="volume-label" id="volumeLabel">35%</span>
                </div>
            </section>

            <footer>
                Made with <span class="heart">♥</span>
            </footer>
        </section>
    </main>

    <audio id="backgroundMusic" src="music.mp3" loop preload="auto"></audio>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        const enterScreen = document.getElementById("enterScreen");
        const backgroundMusic = document.getElementById("backgroundMusic");
        const audioToggle = document.getElementById("audioToggle");
        const audioIcon = document.getElementById("audioIcon");
        const volumeControl = document.getElementById("volumeControl");
        const volumeLabel = document.getElementById("volumeLabel");
        const toast = document.getElementById("toast");
        const namePlaque = document.getElementById("namePlaque");

        let toastTimeout;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("visible");

            clearTimeout(toastTimeout);

            toastTimeout = setTimeout(() => {
                toast.classList.remove("visible");
            }, 2400);
        }

        async function enterPortfolio() {
            enterScreen.classList.add("hidden");

            try {
                await backgroundMusic.play();
                audioIcon.textContent = "♫";
            } catch (error) {
                audioIcon.textContent = "▶";
                showToast("Clique sur le bouton musical pour lancer la musique.");
            }
        }

        enterScreen.addEventListener("click", enterPortfolio);

        enterScreen.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                enterPortfolio();
            }
        });

        backgroundMusic.volume = Number(volumeControl.value) / 100;

        volumeControl.addEventListener("input", () => {
            const volume = Number(volumeControl.value);

            backgroundMusic.volume = volume / 100;
            volumeLabel.textContent = volume + "%";

            if (volume > 0 && backgroundMusic.muted) {
                backgroundMusic.muted = false;
                audioIcon.textContent = "♫";
            }

            if (volume === 0) {
                audioIcon.textContent = "🔇";
            }
        });

        audioToggle.addEventListener("click", async () => {
            if (backgroundMusic.paused) {
                try {
                    await backgroundMusic.play();
                    backgroundMusic.muted = false;
                    audioIcon.textContent = "♫";
                    showToast("Musique activée !");
                } catch (error) {
                    showToast("Impossible de lancer la musique.");
                }

                return;
            }

            backgroundMusic.muted = !backgroundMusic.muted;

            audioIcon.textContent = backgroundMusic.muted ? "🔇" : "♫";

            showToast(
                backgroundMusic.muted
                    ? "Musique coupée."
                    : "Musique activée !"
            );
        });

        document.querySelectorAll(".copy-link").forEach((link) => {
            link.addEventListener("click", async (event) => {
                event.preventDefault();

                const value = link.dataset.copy;
                const message = link.dataset.message;

                try {
                    await navigator.clipboard.writeText(value);
                    showToast(message);
                } catch (error) {
                    const textArea = document.createElement("textarea");

                    textArea.value = value;
                    textArea.style.position = "fixed";
                    textArea.style.opacity = "0";

                    document.body.appendChild(textArea);
                    textArea.select();

                    const copied = document.execCommand("copy");
                    textArea.remove();

                    showToast(
                        copied
                            ? message
                            : "Copie impossible depuis ce navigateur."
                    );
                }
            });
        });

        const maxMagnetOffset = 70;

        function updateMagnet(event) {
            if (window.matchMedia("(pointer: coarse)").matches) {
                return;
            }

            const rect = namePlaque.getBoundingClientRect();

            const currentX = parseFloat(
                getComputedStyle(namePlaque).getPropertyValue("--magnet-x")
            ) || 0;

            const currentY = parseFloat(
                getComputedStyle(namePlaque).getPropertyValue("--magnet-y")
            ) || 0;

            const centerX = rect.left + rect.width / 2 - currentX;
            const centerY = rect.top + rect.height / 2 - currentY;

            const distanceX = event.clientX - centerX;
            const distanceY = event.clientY - centerY;

            const magnetX = Math.max(
                -maxMagnetOffset,
                Math.min(maxMagnetOffset, distanceX * 0.18)
            );

            const magnetY = Math.max(
                -maxMagnetOffset,
                Math.min(maxMagnetOffset, distanceY * 0.18)
            );

            namePlaque.style.setProperty("--magnet-x", magnetX + "px");
            namePlaque.style.setProperty("--magnet-y", magnetY + "px");
        }

        function resetMagnet() {
            namePlaque.style.setProperty("--magnet-x", "0px");
            namePlaque.style.setProperty("--magnet-y", "0px");
        }

        document.addEventListener("mousemove", updateMagnet);
        document.addEventListener("mouseleave", resetMagnet);
        window.addEventListener("blur", resetMagnet);
        window.addEventListener("resize", resetMagnet);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06152b">
  <meta name="description" content="coolbabyoff — Java & Python developer, sysadmin and AgamesStudio founder.">
  <title>coolbabyoff | Portfolio</title>

  <style>
    :root {
      --cyan: #20e9ff;
      --blue: #39a9ff;
      --text: #e9f7ff;
      --muted: #a8d8f5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background-color: #06152b;
      background-image:
        linear-gradient(
          180deg,
          rgba(2, 12, 30, .48),
          rgba(3, 17, 39, .22) 45%,
          rgba(1, 10, 26, .72)
        ),
        url("wallpaper.webp");
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
      overflow-x: hidden;
    }

    /* Header */
    .topbar {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 65px;
      color: #80caff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    /* Profile */
    .profile {
      width: 100%;
      max-width: 570px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fade-in .8s ease both;
    }

    .avatar {
      position: relative;
      z-index: 2;
      width: 154px;
      height: 154px;
      margin-bottom: -13px;
      flex-shrink: 0;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 4px solid #40dfff;
      background: rgba(4, 24, 45, .8);
      box-shadow:
        0 0 12px rgba(32, 233, 255, .9),
        0 0 35px rgba(0, 166, 255, .65);
    }

    /* Glass username plaque */
    .name-plaque {
      width: 100%;
      min-height: 112px;
      padding: 27px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(100, 190, 255, .65);
      border-radius: 25px;
      background: rgba(49, 112, 168, .18);
      backdrop-filter: blur(19px);
      -webkit-backdrop-filter: blur(19px);
      box-shadow:
        inset 0 0 25px rgba(93, 186, 255, .08),
        0 0 22px rgba(0, 145, 255, .08);
    }

    .name-plaque h1 {
      margin: 0;
      color: #a9d9ff;
      font-size: clamp(32px, 7vw, 47px);
      font-weight: 750;
      letter-spacing: -.035em;
      text-shadow:
        0 0 8px rgba(85, 176, 255, .8),
        0 0 24px rgba(37, 145, 255, .4);
      filter: blur(.35px);
    }

    /* Bio */
    .bio {
      width: 94%;
      margin: 13px 0 22px;
      padding: 17px 20px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      color: #d5eaff;
      background: rgba(5, 27, 57, .49);
      border: 1px solid rgba(80, 173, 255, .33);
      border-radius: 23px;
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
      box-shadow: inset 0 0 20px rgba(75, 159, 255, .045);
    }

    .bio-icon {
      flex-shrink: 0;
      padding-top: 2px;
      color: #a6e4ff;
      font-size: 21px;
    }

    .bio p {
      margin: 0;
      font-size: 16px;
      line-height: 1.7;
      letter-spacing: .01em;
    }

    .bio strong {
      color: var(--cyan);
      font-weight: 700;
    }

    /* Contact buttons */
    .links {
      width: 94%;
      display: grid;
      gap: 12px;
    }

    .link {
      width: 100%;
      min-height: 82px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 19px;
      color: var(--cyan);
      text-decoration: none;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      background: rgba(3, 20, 43, .70);
      border: 1px solid rgba(0, 190, 255, .88);
      border-radius: 23px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        inset 0 0 20px rgba(0, 115, 255, .045),
        0 0 12px rgba(0, 110, 255, .07);
      transition:
        transform .22s ease,
        background .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;
    }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-3px);
      background: rgba(5, 46, 81, .83);
      border-color: #55f2ff;
      box-shadow: 0 0 18px rgba(0, 190, 255, .2);
      outline: none;
    }

    .link:active {
      transform: scale(.985);
    }

    /* Custom logos */
    .link-logo {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: block;
      object-fit: contain;
      object-position: center;
    }

    .link-copy {
      flex: 1;
      min-width: 0;
    }

    .link-title {
      display: block;
      margin-bottom: 4px;
      color: #54eaff;
      font-size: 17px;
      font-weight: 500;
    }

    .link-desc {
      display: block;
      color: #8ed5ff;
      font-size: 13px;
      line-height: 1.5;
    }

    .link-action {
      flex-shrink: 0;
      color: var(--cyan);
      font-size: 24px;
      transition: transform .2s ease;
    }

    .link:hover .link-action {
      transform: translateX(3px);
    }

    /* Copy notification */
    #toast {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 24px;
      width: max-content;
      max-width: calc(100% - 30px);
      padding: 13px 19px;
      color: #d9faff;
      background: rgba(3, 23, 45, .94);
      border: 1px solid var(--cyan);
      border-radius: 13px;
      box-shadow: 0 0 24px rgba(0, 190, 255, .2);
      font-size: 13px;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, 12px);
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Footer */
    .footer {
      margin-top: 42px;
      margin-bottom: 5px;
      color: #72baff;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .32em;
      font-size: 10px;
      opacity: .8;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(13px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 22px 12px 24px;
        background-attachment: scroll;
      }

      .topbar {
        margin-bottom: 55px;
        font-size: 11px;
      }

      .profile {
        max-width: 460px;
      }

      .avatar {
        width: 125px;
        height: 125px;
      }

      .name-plaque {
        min-height: 90px;
        padding: 23px 12px;
        border-radius: 21px;
      }

      .name-plaque h1 {
        font-size: clamp(29px, 8vw, 40px);
      }

      .bio {
        padding: 14px;
        gap: 12px;
        border-radius: 19px;
      }

      .bio p {
        font-size: 14px;
        line-height: 1.7;
      }

      .link {
        min-height: 75px;
        padding: 12px 14px;
        gap: 13px;
        border-radius: 19px;
      }

      .link-logo {
        width: 30px;
        height: 30px;
        flex-basis: 30px;
      }

      .link-title {
        font-size: 15px;
      }

      .link-desc {
        font-size: 12px;
      }

      .footer {
        margin-top: 33px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    Portfolio
  </header>

  <main class="profile">

    <!-- Profile picture -->
    <img
      class="avatar"
      src="profile.png"
      alt="coolbabyoff profile picture"
    >

    <!-- Transparent and blurred username plaque -->
    <section class="name-plaque">
      <h1>coolbabyoff</h1>
    </section>

    <!-- English bio -->
    <section class="bio">
      <span class="bio-icon" aria-hidden="true">♟</span>
      <p>
        Yo! I'm <strong>coolbabyoff</strong>, a junior Java &amp;
        Python developer, sysadmin, and founder of
        <strong>AgamesStudio</strong>, specializing in Minecraft
        resource packs!
      </p>
    </section>

    <!-- Contacts -->
    <nav class="links" aria-label="My contacts and profiles">

      <!-- Discord: copies username -->
      <button
        class="link"
        type="button"
        onclick="copyText('coolbabyoff', 'Discord username copied!')"
      >
        <img class="link-logo" src="discord.png" alt="">
        <span class="link-copy">
          <span class="link-title">Discord</span>
          <span class="link-desc">Click to copy: coolbabyoff</span>
        </span>
        <span class="link-action" aria-hidden="true">▣</span>
      </button>

      <!-- PayPal -->
      <a
        class="link"
        href="https://bit.ly/4ev9TRN"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img class="link-logo" src="paypal.png" alt="">
        <span class="link-copy">
          <span class="link-title">PayPal</span>
          <span class="link-desc">Support my projects</span>
        </span>
        <span class="link-action" aria-hidden="true">↗</span>
      </a>

      <!-- Steam -->
      <a
        class="link"
        href="https://steamcommunity.com/id/CBOfficial/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img class="link-logo" src="steam.png" alt="">
        <span class="link-copy">
          <span class="link-title">Steam</span>
          <span class="link-desc">Check out my Steam profile</span>
        </span>
        <span class="link-action" aria-hidden="true">↗</span>
      </a>

      <!-- Roblox -->
      <a
        class="link"
        href="https://roblox.com/users/2521964602/profile"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img class="link-logo" src="roblox.png" alt="">
        <span class="link-copy">
          <span class="link-title">Roblox</span>
          <span class="link-desc">Visit my Roblox profile</span>
        </span>
        <span class="link-action" aria-hidden="true">↗</span>
      </a>

      <!-- PlayStation Network: copies online ID -->
      <button
        class="link"
        type="button"
        onclick="copyText('coolbabyofficiaL', 'PlayStation Network ID copied!')"
      >
        <img class="link-logo" src="playstation.png" alt="">
        <span class="link-copy">
          <span class="link-title">PlayStation Network</span>
          <span class="link-desc">Click to copy: coolbabyofficiaL</span>
        </span>
        <span class="link-action" aria-hidden="true">▣</span>
      </button>

    </nav>

    <footer class="footer">Made with ♥</footer>

  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    let toastTimer;

    function showToast(message) {
      const toast = document.getElementById("toast");

      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2300);
    }

    async function copyText(text, message) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.left = "-9999px";

          document.body.appendChild(textarea);
          textarea.select();

          const success = document.execCommand("copy");
          textarea.remove();

          if (!success) {
            throw new Error("Copy failed");
          }
        }

        showToast(message);
      } catch (error) {
        showToast("Copy manually: " + text);
      }
    }
  </script>

</body>
</html>
